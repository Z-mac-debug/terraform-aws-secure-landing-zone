version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # don't adopt brand-new releases straight away
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /environments/*
      - /modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
